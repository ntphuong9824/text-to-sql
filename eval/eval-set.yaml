# Eval set for the Text-to-SQL assistant (Task 12).
# Gold SQL follows src/main/resources/semantic/semantic-layer.yaml exactly:
#   dw. prefix, fact alias f, revenue = SUM(f.revenue), order_count = COUNT(DISTINCT f.invoice_id),
#   customer_count = COUNT(DISTINCT f.customer_key), dates via dw.dim_date, no year named = all years.
# Gold returns only the columns the question asks for (extra generated columns are ignored by the
# comparator). A top-level ORDER BY appears only where the question implies order (top-N); every
# top-N cutoff below has been checked to be tie-free in the data.
# None of these questions may equal a few-shot example after TextNormalizer.normalize.

items:
  # ---------------- easy (12) ----------------
  - id: e01
    difficulty: easy
    lang: vi
    question: "Tổng số đơn hàng từ trước đến nay"
    gold_sql: |
      SELECT COUNT(DISTINCT f.invoice_id) AS order_count
      FROM dw.fact_sales f
  - id: e02
    difficulty: easy
    lang: en
    question: "How many distinct customers have made a purchase?"
    gold_sql: |
      SELECT COUNT(DISTINCT f.customer_key) AS customer_count
      FROM dw.fact_sales f
  - id: e03
    difficulty: easy
    lang: vi
    question: "Doanh thu năm 2024 là bao nhiêu?"
    gold_sql: |
      SELECT SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2024
  - id: e04
    difficulty: easy
    lang: en
    question: "What was the total revenue in 2021?"
    gold_sql: |
      SELECT SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2021
  - id: e05
    difficulty: easy
    lang: vi
    question: "Có bao nhiêu bài hát trong kho nhạc?"
    gold_sql: |
      SELECT COUNT(*) AS track_count
      FROM dw.dim_track t
  - id: e06
    difficulty: easy
    lang: en
    question: "List all employees and their job titles"
    gold_sql: |
      SELECT e.full_name AS employee_name, e.title AS title
      FROM dw.dim_employee e
  - id: e07
    difficulty: easy
    lang: en
    question: "Total number of units sold"
    gold_sql: |
      SELECT SUM(f.quantity) AS units_sold
      FROM dw.fact_sales f
  - id: e08
    difficulty: easy
    lang: vi
    question: "Doanh thu của thể loại Jazz"
    gold_sql: |
      SELECT SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_track t ON t.track_key = f.track_key
      WHERE t.genre_name = 'Jazz'
  - id: e09
    difficulty: easy
    lang: vi
    question: "Liệt kê các khu vực bán hàng"
    gold_sql: |
      SELECT DISTINCT c.region AS region
      FROM dw.dim_customer c
  - id: e10
    difficulty: easy
    lang: en
    question: "How many orders were placed in 2025?"
    gold_sql: |
      SELECT COUNT(DISTINCT f.invoice_id) AS order_count
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2025
  - id: e11
    difficulty: easy
    lang: vi
    question: "Có bao nhiêu khách hàng ở Brazil?"
    gold_sql: |
      SELECT COUNT(DISTINCT f.customer_key) AS customer_count
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      WHERE c.country = 'Brazil'
  - id: e12
    difficulty: easy
    lang: vi
    question: "Doanh thu của khu vực Nam Mỹ"
    gold_sql: |
      SELECT SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      WHERE c.region = 'South America'

  # ---------------- medium (16) ----------------
  - id: m01
    difficulty: medium
    lang: vi
    question: "Doanh thu tháng 9 theo khu vực"
    gold_sql: |
      SELECT c.region AS region, SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.month = 9
      GROUP BY c.region
  - id: m02
    difficulty: medium
    lang: en
    question: "Revenue by country in 2023"
    gold_sql: |
      SELECT c.country AS country, SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2023
      GROUP BY c.country
  - id: m03
    difficulty: medium
    lang: vi
    question: "Số đơn hàng theo từng năm"
    gold_sql: |
      SELECT d.year AS year, COUNT(DISTINCT f.invoice_id) AS order_count
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      GROUP BY d.year
  - id: m04
    difficulty: medium
    lang: en
    question: "Revenue by media type"
    gold_sql: |
      SELECT t.media_type_name AS media_type_name, SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_track t ON t.track_key = f.track_key
      GROUP BY t.media_type_name
  - id: m05
    difficulty: medium
    lang: vi
    question: "Doanh thu theo quý của năm 2024"
    gold_sql: |
      SELECT d.quarter AS quarter, SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2024
      GROUP BY d.quarter
  - id: m06
    difficulty: medium
    lang: en
    question: "Number of customers handled by each support employee"
    gold_sql: |
      SELECT e.full_name AS employee_name, COUNT(DISTINCT f.customer_key) AS customer_count
      FROM dw.fact_sales f
      JOIN dw.dim_employee e ON e.employee_key = f.employee_key
      GROUP BY e.employee_key, e.full_name
  - id: m07
    difficulty: medium
    lang: vi
    question: "Doanh thu theo tháng của khu vực Châu Âu"
    gold_sql: |
      SELECT d.month AS month, SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE c.region = 'Europe'
      GROUP BY d.month
  - id: m08
    difficulty: medium
    lang: vi
    question: "Mỗi thể loại có bao nhiêu bài hát?"
    gold_sql: |
      SELECT t.genre_name AS genre_name, COUNT(*) AS track_count
      FROM dw.dim_track t
      GROUP BY t.genre_name
  - id: m09
    difficulty: medium
    lang: vi
    question: "Số đơn hàng của khu vực Nam Mỹ theo từng năm"
    gold_sql: |
      SELECT d.year AS year, COUNT(DISTINCT f.invoice_id) AS order_count
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE c.region = 'South America'
      GROUP BY d.year
  - id: m10
    difficulty: medium
    lang: en
    question: "What was the revenue in Q4 2022?"
    gold_sql: |
      SELECT SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2022 AND d.quarter = 4
  - id: m11
    difficulty: medium
    lang: vi
    question: "Số đơn hàng mà mỗi nhân viên hỗ trợ đã phụ trách"
    gold_sql: |
      SELECT e.full_name AS employee_name, COUNT(DISTINCT f.invoice_id) AS order_count
      FROM dw.fact_sales f
      JOIN dw.dim_employee e ON e.employee_key = f.employee_key
      GROUP BY e.employee_key, e.full_name
  - id: m12
    difficulty: medium
    lang: en
    question: "Which months of 2024 had revenue above 40?"
    gold_sql: |
      SELECT d.month AS month
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2024
      GROUP BY d.month
      HAVING SUM(f.revenue) > 40
  - id: m13
    difficulty: medium
    lang: vi
    question: "Doanh thu của từng thành phố ở Canada"
    gold_sql: |
      SELECT c.city AS city, SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      WHERE c.country = 'Canada'
      GROUP BY c.city
  - id: m14
    difficulty: medium
    lang: vi
    question: "Doanh thu hằng năm của định dạng Protected AAC audio file"
    gold_sql: |
      SELECT d.year AS year, SUM(f.revenue) AS revenue
      FROM dw.fact_sales f
      JOIN dw.dim_track t ON t.track_key = f.track_key
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE t.media_type_name = 'Protected AAC audio file'
      GROUP BY d.year
  - id: m15
    difficulty: medium
    lang: vi
    question: "Số khách hàng theo khu vực trong năm 2023"
    gold_sql: |
      SELECT c.region AS region, COUNT(DISTINCT f.customer_key) AS customer_count
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2023
      GROUP BY c.region
  - id: m16
    difficulty: medium
    lang: en
    question: "Which genre had the highest revenue in Europe?"
    gold_sql: |
      SELECT t.genre_name AS genre_name
      FROM dw.fact_sales f
      JOIN dw.dim_track t ON t.track_key = f.track_key
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      WHERE c.region = 'Europe'
      GROUP BY t.genre_name
      ORDER BY SUM(f.revenue) DESC
      LIMIT 1

  # ---------------- hard (12) ----------------
  - id: h01
    difficulty: hard
    lang: vi
    question: "Top 3 quốc gia có doanh thu cao nhất năm 2022"
    gold_sql: |
      SELECT c.country AS country
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2022
      GROUP BY c.country
      ORDER BY SUM(f.revenue) DESC
      LIMIT 3
  - id: h02
    difficulty: hard
    lang: en
    question: "Top 3 albums by revenue"
    gold_sql: |
      SELECT t.album_title AS album_title
      FROM dw.fact_sales f
      JOIN dw.dim_track t ON t.track_key = f.track_key
      GROUP BY t.album_title
      ORDER BY SUM(f.revenue) DESC
      LIMIT 3
  - id: h03
    difficulty: hard
    lang: vi
    question: "Giá trị trung bình mỗi đơn hàng theo từng năm"
    gold_sql: |
      SELECT d.year AS year,
             ROUND(SUM(f.revenue) / COUNT(DISTINCT f.invoice_id), 2) AS avg_order_value
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      GROUP BY d.year
  - id: h04
    difficulty: hard
    lang: vi
    question: "Tỉ lệ phần trăm doanh thu của từng khu vực trên tổng doanh thu"
    gold_sql: |
      SELECT c.region AS region,
             ROUND(100 * SUM(f.revenue) / SUM(SUM(f.revenue)) OVER (), 2) AS revenue_pct
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      GROUP BY c.region
  - id: h05
    difficulty: hard
    lang: en
    question: "For each year from 2022 to 2025, show revenue and the difference from the previous year's revenue"
    gold_sql: |
      WITH yearly AS (
        SELECT d.year AS year, SUM(f.revenue) AS revenue
        FROM dw.fact_sales f
        JOIN dw.dim_date d ON d.date_key = f.date_key
        GROUP BY d.year
      ), diffs AS (
        SELECT y.year, y.revenue, y.revenue - LAG(y.revenue) OVER (ORDER BY y.year) AS revenue_change
        FROM yearly y
      )
      SELECT x.year, x.revenue, x.revenue_change
      FROM diffs x
      WHERE x.year BETWEEN 2022 AND 2025
  - id: h06
    difficulty: hard
    lang: vi
    question: "Khách hàng chi tiêu nhiều nhất ở mỗi khu vực"
    gold_sql: |
      WITH spend AS (
        SELECT c.region AS region, c.customer_key AS customer_key, c.full_name AS customer_name,
               SUM(f.revenue) AS revenue,
               RANK() OVER (PARTITION BY c.region ORDER BY SUM(f.revenue) DESC) AS rk
        FROM dw.fact_sales f
        JOIN dw.dim_customer c ON c.customer_key = f.customer_key
        GROUP BY c.region, c.customer_key, c.full_name
      )
      SELECT s.region, s.customer_name
      FROM spend s
      WHERE s.rk = 1
  - id: h07
    difficulty: hard
    lang: en
    question: "Which customers made purchases in every year from 2021 to 2025?"
    gold_sql: |
      SELECT c.full_name AS customer_name
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year BETWEEN 2021 AND 2025
      GROUP BY c.customer_key, c.full_name
      HAVING COUNT(DISTINCT d.year) = 5
  - id: h08
    difficulty: hard
    lang: vi
    question: "Liệt kê các bài hát thể loại Blues chưa từng được bán"
    gold_sql: |
      SELECT t.track_name AS track_name
      FROM dw.dim_track t
      WHERE t.genre_name = 'Blues'
        AND NOT EXISTS (SELECT 1 FROM dw.fact_sales f WHERE f.track_key = t.track_key)
  - id: h09
    difficulty: hard
    lang: en
    question: "How many tracks have never been sold?"
    gold_sql: |
      SELECT COUNT(*) AS unsold_tracks
      FROM dw.dim_track t
      WHERE NOT EXISTS (SELECT 1 FROM dw.fact_sales f WHERE f.track_key = t.track_key)
  - id: h10
    difficulty: hard
    lang: vi
    question: "Doanh thu quý 1 và quý 2 của từng năm, mỗi năm một dòng"
    gold_sql: |
      SELECT d.year AS year,
             SUM(CASE WHEN d.quarter = 1 THEN f.revenue ELSE 0 END) AS q1_revenue,
             SUM(CASE WHEN d.quarter = 2 THEN f.revenue ELSE 0 END) AS q2_revenue
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      GROUP BY d.year
  - id: h11
    difficulty: hard
    lang: vi
    question: "Doanh thu trung bình trên mỗi khách hàng theo quốc gia"
    gold_sql: |
      SELECT c.country AS country,
             ROUND(SUM(f.revenue) / COUNT(DISTINCT f.customer_key), 2) AS avg_revenue_per_customer
      FROM dw.fact_sales f
      JOIN dw.dim_customer c ON c.customer_key = f.customer_key
      GROUP BY c.country
  - id: h12
    difficulty: hard
    lang: en
    question: "Running total of monthly revenue in 2023"
    gold_sql: |
      SELECT d.month AS month,
             SUM(SUM(f.revenue)) OVER (ORDER BY d.month) AS running_total
      FROM dw.fact_sales f
      JOIN dw.dim_date d ON d.date_key = f.date_key
      WHERE d.year = 2023
      GROUP BY d.month

# Multi-turn chains: each gold_sql is the full standalone answer for that turn as the user meant it.
conversations:
  - id: c1
    turns:
      - question: "doanh thu tháng 9 theo khu vực"
        gold_sql: |
          SELECT c.region AS region, SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_customer c ON c.customer_key = f.customer_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE d.month = 9
          GROUP BY c.region
      - question: "còn tháng 10 thì sao?"
        gold_sql: |
          SELECT c.region AS region, SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_customer c ON c.customer_key = f.customer_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE d.month = 10
          GROUP BY c.region
      - question: "chỉ lấy Châu Âu"
        gold_sql: |
          SELECT SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_customer c ON c.customer_key = f.customer_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE d.month = 10 AND c.region = 'Europe'
  - id: c2
    turns:
      - question: "Revenue by genre in 2024"
        gold_sql: |
          SELECT t.genre_name AS genre_name, SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_track t ON t.track_key = f.track_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE d.year = 2024
          GROUP BY t.genre_name
      - question: "What about 2025?"
        gold_sql: |
          SELECT t.genre_name AS genre_name, SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_track t ON t.track_key = f.track_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE d.year = 2025
          GROUP BY t.genre_name
      - question: "Only the top 2"
        gold_sql: |
          SELECT t.genre_name AS genre_name, SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_track t ON t.track_key = f.track_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE d.year = 2025
          GROUP BY t.genre_name
          ORDER BY revenue DESC
          LIMIT 2
  - id: c3
    turns:
      - question: "Doanh thu theo năm của Bắc Mỹ"
        gold_sql: |
          SELECT d.year AS year, SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_customer c ON c.customer_key = f.customer_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE c.region = 'North America'
          GROUP BY d.year
      - question: "còn Nam Mỹ?"
        gold_sql: |
          SELECT d.year AS year, SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_customer c ON c.customer_key = f.customer_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE c.region = 'South America'
          GROUP BY d.year
  - id: c4
    turns:
      - question: "Top 5 artists by revenue in 2023"
        gold_sql: |
          SELECT t.artist_name AS artist_name
          FROM dw.fact_sales f
          JOIN dw.dim_track t ON t.track_key = f.track_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE d.year = 2023
          GROUP BY t.artist_name
          ORDER BY SUM(f.revenue) DESC
          LIMIT 5
      - question: "And in 2022?"
        gold_sql: |
          SELECT t.artist_name AS artist_name
          FROM dw.fact_sales f
          JOIN dw.dim_track t ON t.track_key = f.track_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE d.year = 2022
          GROUP BY t.artist_name
          ORDER BY SUM(f.revenue) DESC
          LIMIT 5
  - id: c5
    turns:
      - question: "Doanh thu theo thể loại ở Châu Á - Thái Bình Dương"
        gold_sql: |
          SELECT t.genre_name AS genre_name, SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_track t ON t.track_key = f.track_key
          JOIN dw.dim_customer c ON c.customer_key = f.customer_key
          WHERE c.region = 'Asia-Pacific'
          GROUP BY t.genre_name
      - question: "chỉ tính năm 2025"
        gold_sql: |
          SELECT t.genre_name AS genre_name, SUM(f.revenue) AS revenue
          FROM dw.fact_sales f
          JOIN dw.dim_track t ON t.track_key = f.track_key
          JOIN dw.dim_customer c ON c.customer_key = f.customer_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE c.region = 'Asia-Pacific' AND d.year = 2025
          GROUP BY t.genre_name
      - question: "thay doanh thu bằng số đơn hàng"
        gold_sql: |
          SELECT t.genre_name AS genre_name, COUNT(DISTINCT f.invoice_id) AS order_count
          FROM dw.fact_sales f
          JOIN dw.dim_track t ON t.track_key = f.track_key
          JOIN dw.dim_customer c ON c.customer_key = f.customer_key
          JOIN dw.dim_date d ON d.date_key = f.date_key
          WHERE c.region = 'Asia-Pacific' AND d.year = 2025
          GROUP BY t.genre_name

